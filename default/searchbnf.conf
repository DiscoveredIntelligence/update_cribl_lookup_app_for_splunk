# searchbnf.conf for UpdateCriblLookup

[updatecribllookup-command]
syntax = updatecribllookup (workergroup=<string>)? (lookup=<string>)? (lookup_mode=<lookup-mode-option>)? (commit_message=<string>)?
shortdesc = Updates a Cribl lookup with data from Splunk search results
description = An eventing command that synchronizes Splunk search results to a Cribl lookup table. \
    The command processes events from a search pipeline and uploads them to a specified \
    Cribl worker group's lookup. The command yields progress records in real-time during \
    the sync operation, allowing you to monitor the update process. \
    \i\\
    Parameters:\
    \i\\
    - workergroup: Name of the Cribl worker group configuration to use \
    - lookup: Name of the lookup file to update in Cribl \
    - lookup_mode: Lookup mode setting - "auto" preserves existing mode, "memory" stores in memory, "disk" stores on disk (default: auto)\
    - commit_message: Custom commit message for the Cribl deployment (optional)\
    \i\\
    The command requires proper configuration of Cribl API credentials and worker group settings \
    in the UpdateCriblLookup app configuration to function correctly.
usage = public
example1 = | inputlookup threat_intel.csv | updatecribllookup workergroup=prod_workers lookup=threat_feed.csv lookup_mode=memory
comment1 = Synchronizes threat intelligence data from a Splunk lookup to a memory-based Cribl lookup
example2 = index=foo sourcetype=bar | stats count by src_ip, dest_ip | updatecribllookup workergroup=security_wg lookup=ip_stats.csv
comment2 = Updates a Cribl lookup with aggregated security data from Splunk events
example3 = | inputlookup user_list.csv | updatecribllookup workergroup=main lookup=users.csv commit_message="Daily user sync from Splunk" lookup_mode=disk
comment3 = Synchronizes user data with a custom commit message for tracking in Cribl
tags = cribl lookup sync 

[lookup-mode-option]
syntax = auto|memory|disk
description = \
    Specifies the storage mode for the Cribl lookup:\
    \i\\
    - auto: Preserves the existing lookup mode in Cribl (default)\
    \i\\
    - memory: Stores the lookup in memory for faster access\
    \i\\
    - disk: Stores the lookup on disk for persistence
